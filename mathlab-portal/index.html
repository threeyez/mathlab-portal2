<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLab Learning Portal</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --border: #dde1e6;
            --text: #2c3e50;
            --text-muted: #7a8a99;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 24px 32px;
            text-align: center;
        }

        header h1 { font-size: 1.6rem; font-weight: 600; color: #1a252f; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .module-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .module-card h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            color: #1a252f;
        }

        /* Calculator Styling */
        .calc-display {
            width: 100%;
            background: #eef2f5;
            border: 1px solid var(--border);
            padding: 16px;
            font-size: 1.8rem;
            text-align: right;
            border-radius: 6px;
            margin-bottom: 16px;
            font-family: monospace;
            min-height: 70px;
            word-wrap: break-word;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            padding: 16px;
            font-size: 1.2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
            font-weight: 600;
            color: var(--text);
        }

        .calc-btn:hover { background: #f0f4f8; }
        .calc-btn:active { background: #e2e8f0; }
        
        .calc-btn.op { color: var(--accent); }
        .calc-btn.equal { background: var(--accent); color: white; border-color: var(--accent); }
        .calc-btn.equal:hover { background: var(--accent-hover); }

        /* Quiz Styling */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-item:hover {
            background: #eef2f5;
            border-color: var(--accent);
        }

        .quiz-item span { font-weight: 500; }
        .quiz-item .arrow { color: var(--text-muted); }

        /* Quiz Modal */
        #quiz-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .quiz-content {
            background: var(--surface);
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .quiz-content h3 { margin-bottom: 16px; font-size: 1.4rem; }
        .quiz-question { font-size: 1.1rem; margin-bottom: 20px; }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
        }

        .quiz-option:hover { background: #eef2f5; }
        
        .quiz-close {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background: var(--text);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>MathLab Learning Portal</h1>
        <p class="subtitle">Interactive Mathematics, English & Science Resources</p>
    </header>

    <main>
        <!-- Left Column: Math Module (Calculator) -->
        <div class="module-card">
            <h2>Standard Calculator</h2>
            <div class="calc-display" id="calc-display">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="calcClear()">C</button>
                <button class="calc-btn" onclick="calcInput('(')">(</button>
                <button class="calc-btn" onclick="calcInput(')')">)</button>
                <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn op" onclick="calcInput('*')">×</button>
                
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn op" onclick="calcInput('-')">-</button>
                
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button class="calc-btn op" onclick="calcInput('+')">+</button>
                
                <button class="calc-btn" onclick="calcInput('0')">0</button>
                <button class="calc-btn" onclick="calcInput('.')">.</button>
                <button class="calc-btn" onclick="calcBackspace()">⌫</button>
                <button class="calc-btn equal" onclick="calcEvaluate()">=</button>
            </div>
        </div>

        <!-- Right Column: Practice Modules -->
        <div class="module-card">
            <h2>Practice Modules</h2>
            <div class="quiz-list">
                <div class="quiz-item" onclick="openQuiz('math')">
                    <span>Mathematics Practice</span>
                    <span class="arrow">→</span>
                </div>
                <div class="quiz-item" onclick="openQuiz('english')">
                    <span>English Grammar</span>
                    <span class="arrow">→</span>
                </div>
                <div class="quiz-item" onclick="openQuiz('science')">
                    <span>Science Foundations</span>
                    <span class="arrow">→</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        MathLab v2.1 | For educational use
    </footer>

    <!-- Quiz Modal -->
    <div id="quiz-modal">
        <div class="quiz-content">
            <h3 id="quiz-title">Practice</h3>
            <div class="quiz-question" id="quiz-question">Loading question...</div>
            <div id="quiz-options"></div>
            <button class="quiz-close" onclick="closeQuiz()">Return to Portal</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CALCULATOR LOGIC
        // ==========================================
        let calcDisplay = document.getElementById('calc-display');
        let currentInput = "0";
        let secretCode = "0000";

        function updateDisplay() {
            calcDisplay.textContent = currentInput === "" ? "0" : currentInput;
        }

        function calcInput(val) {
            // Secret bypass logic
            if (val.match(/[0-9]/)) {
                if (currentInput === "0") currentInput = "";
                currentInput += val;

                // Check for the 0000 bypass
                if (currentInput.endsWith("0000")) {
                    window.location.href = "games.html";
                    return;
                }
            } else {
                // Operators and decimals
                if (currentInput === "0" && val !== ".") {
                    // Prevent starting with an operator (unless negative)
                    if (val !== "-") return;
                }
                currentInput += val;
            }
            updateDisplay();
        }

        function calcClear() {
            currentInput = "0";
            updateDisplay();
        }

        function calcBackspace() {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === "") currentInput = "0";
            updateDisplay();
        }

        function calcEvaluate() {
            try {
                // Evaluate the expression safely-ish (no eval if we can avoid, but eval is fine for a front-end toy)
                let result = eval(currentInput);
                currentInput = String(result);
                updateDisplay();
            } catch (e) {
                currentInput = "Error";
                updateDisplay();
                setTimeout(calcClear, 1500);
            }
        }

        // Add keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') calcInput(e.key);
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') calcInput(e.key);
            if (e.key === '.') calcInput('.');
            if (e.key === 'Enter') calcEvaluate();
            if (e.key === 'Backspace') calcBackspace();
            if (e.key === 'Escape') calcClear();
        });

        // ==========================================
        // QUIZ LOGIC
        // ==========================================
        const quizzes = {
            math: [
                { q: "What is the value of x in: 3x - 7 = 14?", a: ["x = 5", "x = 7", "x = 9", "x = 3"], correct: 1 },
                { q: "What is the area of a circle with radius 4?", a: ["16π", "8π", "4π", "32π"], correct: 0 }
            ],
            english: [
                { q: "Which of the following is a noun?", a: ["Run", "Quickly", "Beautiful", "Dog"], correct: 3 },
                { q: "Identify the correct spelling:", a: ["Recieve", "Receive", "Receeve", "Riceive"], correct: 1 }
            ],
            science: [
                { q: "What is the chemical symbol for water?", a: ["CO2", "H2O", "O2", "NaCl"], correct: 1 },
                { q: "What force keeps us on the ground?", a: ["Magnetism", "Friction", "Gravity", "Inertia"], correct: 2 }
            ]
        };

        let currentQuiz = null;
        let currentQIndex = 0;

        function openQuiz(subject) {
            currentQuiz = quizzes[subject];
            currentQIndex = 0;
            document.getElementById('quiz-title').textContent = subject.charAt(0).toUpperCase() + subject.slice(1) + " Practice";
            document.getElementById('quiz-modal').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            const qData = currentQuiz[currentQIndex];
            document.getElementById('quiz-question').textContent = qData.q;
            
            const optionsDiv = document.getElementById('quiz-options');
            optionsDiv.innerHTML = '';

            qData.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const qData = currentQuiz[currentQIndex];
            if (selectedIndex === qData.correct) {
                alert("Correct! Great job.");
                currentQIndex++;
                if (currentQIndex < currentQuiz.length) {
                    loadQuestion();
                } else {
                    alert("Module completed!");
                    closeQuiz();
                }
            } else {
                alert("Incorrect. Try again.");
            }
        }

        function closeQuiz() {
            document.getElementById('quiz-modal').style.display = 'none';
        }
    </script>
</body>
</html>
